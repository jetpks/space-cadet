name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish gem
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC token for RubyGems trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5

      - name: Build gem
        run: |
          gem build space-cadet.gemspec
          mkdir -p pkg/
          mv *.gem pkg/

      # Trusted publishing: no API token. Auth is a short-lived OIDC
      # credential minted at run time, scoped to this repo + workflow.
      # Requires a (pending) trusted publisher configured on rubygems.org.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems
        run: gem push pkg/space-cadet-*.gem

      - name: Smoke-test the published gem
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            gem install space-cadet --version "$version" && break
            echo "not indexed yet (attempt $attempt) — retrying in 15s"
            sleep 15
          done
          space version

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: pkg/*.gem
          generate_release_notes: true
          # Prerelease tags (e.g. v2.0.0.rc1) must not be published as "latest".
          prerelease: ${{ contains(github.ref_name, '.rc') || contains(github.ref_name, '.beta') || contains(github.ref_name, '.alpha') || contains(github.ref_name, '.pre') || contains(github.ref_name, '-') }}

      # Homebrew tap bump PR — BRIEF §"Channel decision" item 2. Requires the
      # repository secret TAP_BUMP_TOKEN: a fine-grained PAT scoped to
      # jetpks/homebrew-tap with Contents: read/write + Pull requests:
      # read/write. Opens a version-bump PR (url + sha256 only) — NEVER
      # merges; the tap's brew test-bot CI gates the merge, a human clicks it.
      - name: Check out Homebrew tap
        if: ${{ !(contains(github.ref_name, '.rc') || contains(github.ref_name, '.beta') || contains(github.ref_name, '.alpha') || contains(github.ref_name, '.pre') || contains(github.ref_name, '-')) }}
        uses: actions/checkout@v7
        with:
          repository: jetpks/homebrew-tap
          path: tap
          token: ${{ secrets.TAP_BUMP_TOKEN }}

      - name: Open Homebrew tap bump PR
        if: ${{ !(contains(github.ref_name, '.rc') || contains(github.ref_name, '.beta') || contains(github.ref_name, '.alpha') || contains(github.ref_name, '.pre') || contains(github.ref_name, '-')) }}
        env:
          GEM_NAME: space-cadet
          TAP_BUMP_TOKEN: ${{ secrets.TAP_BUMP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://rubygems.org/downloads/${GEM_NAME}-${version}.gem"
          sha256="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          test "${#sha256}" -eq 64
          formula="Formula/${GEM_NAME}.rb"
          cd tap
          if grep -q "downloads/${GEM_NAME}-${version}.gem" "$formula"; then
            echo "tap formula already at ${GEM_NAME} ${version} — nothing to bump"
            exit 0
          fi
          branch="bump/${GEM_NAME}-${version}"
          git config user.name  "jetpks release workflow"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$branch"
          sed -i -E \
            -e "s|url \"https://rubygems.org/downloads/${GEM_NAME}-[^\"]*\\.gem\"|url \"${url}\"|" \
            -e "s|sha256 \"[0-9a-f]{64}\"|sha256 \"${sha256}\"|" \
            "$formula"
          ruby -c "$formula"
          grep -q "url \"${url}\"" "$formula"
          grep -q "sha256 \"${sha256}\"" "$formula"
          git add "$formula"
          git commit -m "${GEM_NAME} ${version}"
          git push --force origin "$branch"
          open_prs="$(GH_TOKEN="${TAP_BUMP_TOKEN}" gh pr list --repo jetpks/homebrew-tap --head "$branch" --state open --json number --jq 'length')"
          if [ "$open_prs" -eq 0 ]; then
            GH_TOKEN="${TAP_BUMP_TOKEN}" gh pr create \
              --repo jetpks/homebrew-tap \
              --base main \
              --head "$branch" \
              --title "${GEM_NAME} ${version}" \
              --body "Version bump opened by the ${GEM_NAME} release workflow. url + sha256 only. Merge after \`brew test-bot\` is green — never auto-merge."
          else
            echo "bump PR for ${branch} already open — branch force-refreshed"
          fi
